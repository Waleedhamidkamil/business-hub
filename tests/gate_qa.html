<!DOCTYPE html>
<!-- Manual QA page for the gate (static/gate.js + gate.css), 2026-10-02.
     Open it in a browser: it plays lock and company switch, including the
     reload half of a switch, against a stand-in bridge. The #gate block and the
     fill script below are a byte-for-byte copy of templates/index.html's -
     tests/gate_contract.test.js fails if they drift apart. -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Gate QA</title>
<link rel="stylesheet" href="../static/app_styles.css">
<link rel="stylesheet" href="../static/dark.css">
<link rel="stylesheet" href="../static/gate.css">
<script>
  (function () {
    try {
      if (localStorage.getItem("abraj_theme") === "dark")
        document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) { /* ignore */ }
  })();
</script>
<style>
  body { margin: 0; font-family: "Roboto", "Segoe UI", sans-serif; background: var(--bg); color: var(--text); direction: ltr; }
  .qa-bar { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .qa-bar button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  .qa-hero { margin: 16px; padding: 28px; border-radius: 14px; color: #fff; background: var(--qa-accent, #1F3864); }
  .qa-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 0 16px; }
  .qa-cards div { height: 90px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
  #qaLog { margin: 16px; font: 12px ui-monospace, Consolas, monospace; color: var(--text-muted); white-space: pre-wrap; }
</style>
</head>
<body>

<!-- ===================== THE GATE (2026-10-02, static/gate.js) =====================
     Two doors over the whole app: company switch and lock. Must stay the FIRST
     thing in <body> with its fill script right after it, so a reload in the
     middle of a company switch paints the doors shut on its very first frame.
     Each door carries half of the seal (the company logo in a ring). -->
<div id="gate" aria-hidden="true" role="dialog" aria-label="Business Hub">
    <div class="gate-door l">
        <div class="gate-brand">
            <div class="gate-name">Business Hub</div>
            <div class="gate-co" id="gateCo"></div>
        </div>
        <div class="gate-seal"><img alt="" src=""><i class="gate-orbit" aria-hidden="true"></i></div>
    </div>
    <div class="gate-door r">
        <div class="gate-seal"><img alt="" src=""><i class="gate-orbit" aria-hidden="true"></i></div>
        <div class="gate-in" id="gateIn"></div>
    </div>
</div>
<script>
  (function () {
    try {
      var s = JSON.parse(sessionStorage.getItem("bh-gate") || "null");
      if (!s || s.mode !== "switch") return;
      var g = document.getElementById("gate");
      g.classList.add("no-anim");
      document.documentElement.classList.add("gate-closed");
      document.documentElement.style.setProperty("--gate-accent", s.accent || "#1F3864");
      g.style.setProperty("--gate-sweep", Math.min(1, (s.stage || 0) / 3) * 360 + "deg");
      var seals = g.querySelectorAll(".gate-seal img");
      for (var i = 0; i < seals.length; i++) seals[i].src = s.logo || "";
      document.getElementById("gateCo").textContent = s.label || "";
      document.getElementById("gateIn").innerHTML = s.html || "";
      g.setAttribute("aria-hidden", "false");
    } catch (e) { /* no gate this time */ }
  })();
</script>

<div class="qa-bar">
  <button type="button" id="qaLock">Lock (Ctrl+L)</button>
  <button type="button" id="qaSwitch">Switch company</button>
  <button type="button" id="qaFail">Switch that fails</button>
  <button type="button" id="qaTheme">Toggle dark</button>
</div>
<div class="qa-hero"><h1 style="margin:0">Good evening, <span id="dashUser">Waleed</span></h1><p id="qaCompany"></p></div>
<div class="qa-cards"><div></div><div></div><div></div><div></div></div>
<div id="qaLog"></div>

<script>
  // Stand-in bridge. Company state lives in sessionStorage so it survives the reload.
  const BRANDS = {
    abraj: { id: "abraj", label: "Abraj Albadr", accent: "#1F3864", logo: "../data/profiles/abraj/assets/logo.png" },
    eshraqat: { id: "eshraqat", label: "Eshraqat Albadr", accent: "#861432", logo: "../data/profiles/eshraqat/assets/logo.png" },
  };
  const active = () => sessionStorage.getItem("qa-company") || "abraj";
  const log = (m) => { document.getElementById("qaLog").textContent += m + "\n"; };
  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  window.pywebview = { api: {
    gate_ready: async () => { log("gate_ready"); return { ok: true }; },
    gate_brief: async () => { await wait(150); return { ok: true, lines: [
      { value: "USD 17,697", text: "waiting for payment", detail: "11 invoices, oldest 67 days" },
      { value: "29 documents", text: "not submitted yet", detail: "15 invoices, 14 delivery notes, oldest 138 days" },
      { value: "4 documents", text: "so far this month", detail: "USD 6,900 invoiced" } ] }; },
  } };
</script>
<script src="../static/gate.js"></script>
<script>
  document.documentElement.style.setProperty("--qa-accent", BRANDS[active()].accent);
  document.getElementById("qaCompany").textContent = BRANDS[active()].label;
  // What bootstrap() does: interface loaded, then the dashboard after ~0.8 s.
  window.Gate.pageLoaded();
  // ?hold keeps the doors shut after a switch, for a screenshot.
  if (!location.search.includes("hold")) setTimeout(() => window.Gate.ready(), 800);

  async function doSwitch(fail) {
    const to = active() === "abraj" ? "eshraqat" : "abraj";
    const result = await window.Gate.switchTo(BRANDS[active()], BRANDS[to], async () => {
      await wait(400);
      if (fail) return { ok: false, error: "stand-in failure" };
      sessionStorage.setItem("qa-company", to);
      return { ok: true, reload: true };
    });
    log("switch result " + JSON.stringify(result));
    if (result && result.ok && result.reload) location.reload();
  }
  document.getElementById("qaLock").onclick = () => window.Gate.lock(BRANDS[active()]);
  document.getElementById("qaSwitch").onclick = () => doSwitch(false);
  document.getElementById("qaFail").onclick = () => doSwitch(true);
  document.getElementById("qaTheme").onclick = () => {
    const dark = document.documentElement.getAttribute("data-theme") !== "dark";
    if (dark) document.documentElement.setAttribute("data-theme", "dark");
    else document.documentElement.removeAttribute("data-theme");
  };
  // ?auto=lock | ?auto=switch plays one moment on load (headless screenshots);
  // add &hold to keep the doors shut after a switch, &dark for the dark theme.
  if (location.search.includes("dark")) document.documentElement.setAttribute("data-theme", "dark");
  const auto = (location.search.match(/auto=(\w+)/) || [])[1];
  if (auto === "lock") setTimeout(() => window.Gate.lock(BRANDS[active()]), 100);
  if (auto === "switch" && !window.Gate.isBusy() && !sessionStorage.getItem("qa-switched")) {
    sessionStorage.setItem("qa-switched", "1");
    setTimeout(() => doSwitch(false), 100);
  }
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && (e.key === "l" || e.key === "L")) { e.preventDefault(); window.Gate.lock(BRANDS[active()]); }
  });
</script>
</body>
</html>
